name: Storefront
options:
  bundleIdPrefix: com.humanmarketing
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Storefront:
    type: application
    platform: macOS
    sources:
      - path: Storefront
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.humanmarketing.storefront
        INFOPLIST_FILE: Storefront/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Storefront/Resources/Storefront.entitlements
    info:
      path: Storefront/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Storefront
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Copyright © 2026 Human Marketing."
    entitlements:
      path: Storefront/Resources/Storefront.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
