name: Storefront
options:
  bundleIdPrefix: com.humanmarketing
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4

# Team ID via Config/Signing.local.xcconfig (see Config/Signing.local.xcconfig.example).
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Storefront:
    type: application
    platform: macOS
    sources:
      - path: Storefront
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.humanmarketing.storefront
        INFOPLIST_FILE: Storefront/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Storefront/Resources/Storefront.entitlements
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
    info:
      path: Storefront/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Storefront
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.0.2"
        CFBundleVersion: "2"
        NSHumanReadableCopyright: "Copyright © 2026 Human Marketing."
        SUFeedURL: "https://github.com/nuotsu/storefront-macos-menubar/releases/latest/download/appcast.xml"
        SUPublicEDKey: "v/SVpv1UO0YocJuBwLCj9eF9DV5SooDM3VxnarGWJf0="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Storefront/Resources/Storefront.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
